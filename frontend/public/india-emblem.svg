<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <!-- Lion Capital Vector Representation -->
  <g fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Lions Crest -->
    <path d="M 140 120 C 140 80, 160 50, 200 40 C 240 50, 260 80, 260 120 C 270 140, 280 180, 250 220 L 150 220 C 120 180, 130 140, 140 120 Z" fill="#F8FAFC"/>
    <!-- Left Lion Profile -->
    <path d="M 140 120 C 100 110, 60 140, 70 180 C 80 210, 120 220, 150 220"/>
    <!-- Right Lion Profile -->
    <path d="M 260 120 C 300 110, 340 140, 330 180 C 320 210, 280 220, 250 220"/>

    <!-- Mane and Details -->
    <path d="M 170 80 Q 200 100 230 80"/>
    <path d="M 160 110 Q 200 130 240 110"/>
    <path d="M 155 140 Q 200 160 245 140"/>
    <path d="M 150 170 Q 200 190 250 170"/>

    <!-- Abacus Base -->
    <rect x="80" y="220" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="6"/>

    <!-- Center Ashoka Chakra on Abacus -->
    <circle cx="200" cy="245" r="18" fill="#2563EB" stroke="#0F172A" stroke-width="4"/>
    <circle cx="200" cy="245" r="4" fill="#FFFFFF"/>

    <!-- Bull & Horse reliefs -->
    <path d="M 110 245 C 120 235, 130 245, 140 245" stroke="#0F172A" stroke-width="4"/>
    <path d="M 260 245 C 270 235, 280 245, 290 245" stroke="#0F172A" stroke-width="4"/>

    <!-- Bell Lotus Base -->
    <path d="M 100 270 C 110 320, 150 350, 200 350 C 250 350, 290 320, 300 270 Z" fill="#F8FAFC"/>
    <path d="M 140 270 L 160 330"/>
    <path d="M 180 270 L 190 345"/>
    <path d="M 220 270 L 210 345"/>
    <path d="M 260 270 L 240 330"/>

    <!-- Pedestal Base -->
    <rect x="70" y="350" width="260" height="20" rx="4" fill="#0F172A"/>
  </g>

  <!-- Devanagari Motto: Satyameva Jayate (सत्यमेव जयते) -->
  <text x="200" y="430" text-anchor="middle" font-family="'Inter', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="32" fill="#0F172A" letter-spacing="2">
    सत्यमेव जयते
  </text>
  <text x="200" y="460" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#64748B" letter-spacing="3">
    TRUTH ALONE TRIUMPHS
  </text>
</svg>
